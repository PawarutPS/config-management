[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamodb-config-manager"
version = "0.1.0"
description = "Git-backed DynamoDB configuration deployment tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
dynamodb-config-manager = "dynamodb_config_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
